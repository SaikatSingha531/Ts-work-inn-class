  <title>Form Submit Example (ID, Name, Email)</title>
</head>
<body>
  <h2>User Form</h2>
  <form id="userForm" onsubmit="handleSubmit(event)">
    <label>
      Name:
      <input type="text" id="name" required />
    </label>
    <label>
      Email:
      <input type="email" id="email" required />
    </label>
    <button type="submit">Submit</button>
  </form>
